<!DOCTYPE html>
<html lang="zh-Hant-TW" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="回饋管家">
  <meta name="robots" content="noindex, nofollow">
  <title>刷卡回饋管家 — 極簡額度與登錄控管</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/png" href="icon-192.png?v=2">
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png?v=2">
  <style>
    :root[data-theme="dark"] {
      --bg-main: #0B0F17;
      --bg-card: #151C28;
      --bg-card-hover: #1C2536;
      --bg-subtle: #1E293B;
      --bg-input: #0F172A;
      --border: #263348;
      --text-main: #F1F5F9;
      --text-sub: #94A3B8;
      --text-muted: #64748B;
      --accent: #38BDF8;
      --accent-bg: rgba(56, 189, 248, 0.12);
      --green: #10B981;
      --green-bg: rgba(16, 185, 129, 0.14);
      --amber: #F59E0B;
      --amber-bg: rgba(245, 158, 11, 0.14);
      --red: #EF4444;
      --red-bg: rgba(239, 68, 68, 0.15);
      --purple: #A855F7;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    :root[data-theme="light"] {
      --bg-main: #F1F5F9;
      --bg-card: #FFFFFF;
      --bg-card-hover: #F8FAFC;
      --bg-subtle: #E2E8F0;
      --bg-input: #F8FAFC;
      --border: #CBD5E1;
      --text-main: #0F172A;
      --text-sub: #475569;
      --text-muted: #64748B;
      --accent: #0284C7;
      --accent-bg: rgba(2, 132, 199, 0.1);
      --green: #059669;
      --green-bg: rgba(5, 150, 105, 0.12);
      --amber: #D97706;
      --amber-bg: rgba(217, 119, 6, 0.12);
      --red: #DC2626;
      --red-bg: rgba(220, 38, 38, 0.12);
      --purple: #7E22CE;
      --shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      padding-bottom: calc(76px + env(safe-area-inset-bottom, 16px));
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 12px 14px;
      padding-top: max(12px, env(safe-area-inset-top));
    }

    /* 頂部狀態列 */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand h1 {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.3px;
    }
    .sync-badge {
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 99px;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .icon-btn {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s;
    }
    .icon-btn:hover { background: var(--bg-card-hover); }

    /* 總覽儀表板 */
    .summary-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    .sum-item {
      display: flex;
      flex-direction: column;
    }
    .sum-label {
      font-size: 11px;
      color: var(--text-sub);
      margin-bottom: 2px;
    }
    .sum-val {
      font-size: 18px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .sum-val.reward { color: var(--green); }
    .sum-val.accent { color: var(--accent); }

    /* 卡片視圖（解決痛點 1.3：清楚顯示距離封頂還可刷多少 + 擬真卡面識別） */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .cc-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--card-theme, var(--accent));
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
      transition: transform 0.15s, border-color 0.15s;
    }
    .cc-card:hover {
      border-color: var(--card-theme, var(--accent));
    }
    .cc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 12px;
    }
    .cc-identity {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    /* 真實銀行官方信用卡卡面 (標準 ID-1 比例 85.6:54 ≈ 1.585) */
    .mini-card-art {
      width: 84px;
      height: 53px;
      border-radius: 7px;
      position: relative;
      flex-shrink: 0;
      padding: 5px 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.3);
      overflow: hidden;
      user-select: none;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background-size: cover;
      background-position: center;
    }
    .mc-real-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 2;
      border-radius: inherit;
      background: #ffffff;
      display: block;
    }
    .mini-card-art::after {
      content: "";
      position: absolute;
      top: -50%;
      left: -30%;
      width: 90%;
      height: 200%;
      background: linear-gradient(115deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.02) 45%, transparent 50%);
      transform: rotate(12deg);
      pointer-events: none;
    }
    .mc-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1;
    }
    .mc-bank {
      font-size: 8.5px;
      font-weight: 800;
      letter-spacing: 0.2px;
      opacity: 0.95;
      line-height: 1;
      text-shadow: 0 1px 2px rgba(0,0,0,0.25);
    }
    .mc-icon {
      font-size: 11px;
      line-height: 1;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,0.2));
    }
    .mc-mid {
      display: flex;
      align-items: center;
      gap: 4px;
      z-index: 1;
    }
    .mc-chip {
      width: 11px;
      height: 8px;
      border-radius: 2px;
      background: linear-gradient(135deg, #FDE68A 0%, #D97706 100%);
      border: 0.5px solid rgba(0, 0, 0, 0.25);
      box-shadow: inset 0 0 1px rgba(255,255,255,0.6);
    }
    .mc-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 1;
    }
    .mc-label {
      font-size: 8.5px;
      font-weight: 800;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 48px;
      line-height: 1.1;
    }
    .mc-net {
      font-size: 7px;
      font-weight: 900;
      font-style: italic;
      opacity: 0.9;
      line-height: 1;
    }
    .mini-card-art.sm {
      width: 58px;
      height: 37px;
      border-radius: 5px;
      padding: 3px 4px;
    }
    .mini-card-art.sm .mc-chip { width: 8px; height: 6px; }
    .mini-card-art.sm .mc-bank { font-size: 7.5px; }
    .mini-card-art.sm .mc-label { font-size: 7px; max-width: 34px; }
    .mini-card-art.sm .mc-icon { font-size: 9px; }

    .cc-title-wrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .cc-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .cc-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }
    .cc-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--accent-bg);
      color: var(--accent);
    }
    .cc-cycle {
      font-size: 11px;
      color: var(--text-muted);
    }
    .cc-stats-right {
      text-align: right;
      flex-shrink: 0;
    }
    .cc-reward {
      font-size: 16px;
      font-weight: 800;
      color: var(--green);
      font-variant-numeric: tabular-nums;
    }
    .cc-spent {
      font-size: 12px;
      color: var(--text-sub);
      font-variant-numeric: tabular-nums;
    }

    /* 多軌額度條（核心設計） */
    .quota-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 11px;
    }
    .quota-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .quota-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 12.5px;
      gap: 6px;
    }
    .quota-name {
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .quota-remain {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .quota-remain.ok { color: var(--accent); }
    .quota-remain.warn { color: var(--amber); }
    .quota-remain.full { color: var(--red); }
    .quota-remain.unlimited { color: var(--green); }
    .quota-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 400;
      margin-left: 4px;
    }
    .q-track {
      height: 6px;
      width: 100%;
      background: var(--bg-subtle);
      border-radius: 99px;
      overflow: hidden;
    }
    .q-fill {
      height: 100%;
      border-radius: 99px;
      background: var(--accent);
      transition: width 0.3s ease;
    }
    .q-fill.warn { background: var(--amber); }
    .q-fill.full { background: var(--red); }
    .q-fill.done { background: var(--green); }

    /* 卡片底部操作列 */
    .cc-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn {
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-main);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.15s;
      text-decoration: none;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn-primary {
      background: var(--accent);
      color: #0F172A;
      border-color: transparent;
      flex: 1;
      font-weight: 700;
    }
    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
    }
    .btn-danger {
      background: var(--red-bg);
      color: var(--red);
      border-color: rgba(239, 68, 68, 0.3);
    }

    /* 底部導覽列 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
      z-index: 100;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.2);
    }
    .nav-item {
      flex: 1;
      max-width: 160px;
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 6px 4px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 11px;
      font-weight: 600;
    }
    .nav-item .nav-icon { font-size: 18px; }
    .nav-item.active {
      color: var(--accent);
      background: var(--accent-bg);
    }

    /* 分頁容器 */
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    /* 篩選器與搜尋列 */
    .filter-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 10px;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .chip {
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-sub);
      padding: 6px 12px;
      border-radius: 99px;
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.active {
      background: var(--accent);
      color: #0F172A;
      border-color: var(--accent);
      font-weight: 700;
    }
    .search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 12px;
      outline: none;
    }
    .search-input:focus { border-color: var(--accent); }

    /* 登錄活動卡片 */
    .reg-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 15px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .reg-card.is-full {
      opacity: 0.72;
      border-color: rgba(239, 68, 68, 0.35);
    }
    .reg-card.is-done {
      border-color: rgba(16, 185, 129, 0.45);
    }
    .reg-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .reg-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
    }
    .status-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .status-pill.ok { background: var(--green-bg); color: var(--green); }
    .status-pill.full { background: var(--red-bg); color: var(--red); }
    .status-pill.done { background: var(--accent-bg); color: var(--accent); }
    .reg-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      font-size: 12.5px;
      color: var(--text-sub);
    }
    .reg-meta span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .reg-cards-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .card-tag {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 5px;
      background: var(--bg-subtle);
      color: var(--text-sub);
    }
    .card-tag.mine {
      background: var(--accent-bg);
      color: var(--accent);
      font-weight: 600;
    }

    /* 彈窗 Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 18px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .modal-title {
      font-size: 17px;
      font-weight: 700;
      margin: 0;
    }
    .close-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 20px;
      cursor: pointer;
      padding: 2px 6px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 5px;
    }
    .form-control {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }
    .form-control:focus { border-color: var(--accent); }
    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .radio-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-input);
      border: 1px solid var(--border);
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13.5px;
    }
    .radio-option:has(input:checked) {
      border-color: var(--accent);
      background: var(--accent-bg);
    }
    .tx-preview-box {
      background: var(--bg-input);
      border: 1px dashed var(--accent);
      border-radius: 10px;
      padding: 10px 12px;
      margin: 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 交易明細列表 */
    .tx-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .tx-item:last-child { border-bottom: none; }

    /* 管理卡片勾選網格 */
    .manage-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 8px;
    }
    .manage-card-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
    }
    .manage-card-item.selected {
      border-color: var(--accent);
      background: var(--accent-bg);
    }

    .empty-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--text-muted);
      background: var(--bg-card);
      border: 1px dashed var(--border);
      border-radius: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 頂部工具列 -->
    <header class="topbar">
      <div class="brand">
        <h1 style="display:flex; align-items:center; gap:8px;">
          <img src="favicon.svg" alt="App Icon" style="width:28px; height:28px; border-radius:7px; box-shadow:0 2px 8px rgba(0,0,0,0.35);">
          <span>刷卡回饋管家</span>
        </h1>
        <span class="sync-badge" id="syncStatusBadge">載入資料中...</span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" onclick="openLocationModal()" id="locBtn" title="切換消費國家與匯率">
          <span id="locFlag">🇹🇼</span> <span id="locCurrency">TWD</span>
        </button>
        <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="切換深色/淺色模式">☀️</button>
      </div>
    </header>
    <!-- 隱藏的卡面圖片上傳選擇器 -->
    <input type="file" id="cardPhotoFileInput" accept="image/*" style="display:none" onchange="handleCardPhotoSelected(this)">

    <!-- 頂部統計儀表板 -->
    <section class="summary-bar">
      <div class="sum-item">
        <span class="sum-label">當期總消費</span>
        <span class="sum-val" id="sumTotalSpent">$0</span>
      </div>
      <div class="sum-item">
        <span class="sum-label">當期預估回饋</span>
        <span class="sum-val reward" id="sumTotalReward">+$0</span>
      </div>
      <div class="sum-item">
        <span class="sum-label">監控中卡片 / 待登錄</span>
        <span class="sum-val accent" id="sumActiveCards">0 張 / 0 檔</span>
      </div>

        isCustom: true
      }));
      return [...CARDS_DB, ...customMapped];
    }

    // =========================================================================
    // 2. 帳單週期與交易存取（100% 相容原版 localStorage 結構）
    // =========================================================================
    function getTransactions(cardId) {
      return JSON.parse(localStorage.getItem(`transactions_${cardId}`) || '[]');
    }

    function saveTransactions(cardId, txs) {
      localStorage.setItem(`transactions_${cardId}`, JSON.stringify(txs));
    }

    function getActualCycleDay(year, monthIndex, cycleDay) {
      const lastDay = new Date(year, monthIndex + 1, 0).getDate();
      return Math.min(cycleDay, lastDay);
    }

    function getCycleRange(cardId) {
      const cycleDay = parseInt(cardSettings[cardId]?.cycleDay) || 0;
      const now = new Date();
      const y = now.getFullYear();
      const m = now.getMonth();
      const d = now.getDate();

      if (!cycleDay || cycleDay <= 0) {
        const start = new Date(y, m, 1, 0, 0, 0);
        const end = new Date(y, m + 1, 0, 23, 59, 59);
        return { start, end, label: `${m + 1}/1 - ${m + 1}/${end.getDate()} (當月)` };
      }

      const thisCycleDay = getActualCycleDay(y, m, cycleDay);
      let start, end;
      if (d > thisCycleDay) {
        start = new Date(y, m, thisCycleDay + 1, 0, 0, 0);
        const nextCycleDay = getActualCycleDay(y, m + 1, cycleDay);
        end = new Date(y, m + 1, nextCycleDay, 23, 59, 59);
      } else {
        const prevCycleDay = getActualCycleDay(y, m - 1, cycleDay);
        start = new Date(y, m - 1, prevCycleDay + 1, 0, 0, 0);
        end = new Date(y, m, thisCycleDay, 23, 59, 59);
      }
      const label = `${start.getMonth() + 1}/${start.getDate()} - ${end.getMonth() + 1}/${end.getDate()} (結帳日${cycleDay}號)`;
      return { start, end, label };
    }

    function getCurrentCycleTxs(cardId) {
      const all = getTransactions(cardId);
      const { start, end } = getCycleRange(cardId);
      return all.filter(tx => {
        if (!tx.date) return true;
        const dt = new Date(tx.date + 'T12:00:00');
        return dt >= start && dt <= end;
      });
    }

        let cum = 0;
        txs.forEach(tx => {
          const amt = Number(tx.amountTWD || tx.amount) || 0;
          let r = 0;
          if (cap > 0) {
            if (cum < cap) {
              const av = Math.min(amt, cap - cum);
              r = rf(av * r1) + rf((amt - av) * r2);
            } else {
              r = rf(amt * r2);
            }
          } else {
            r = rf(amt * r1);
          }
          cum += amt;
          totalReward += r;
          perTxRewards.push({ tx, reward: r });
        });

        if (cap > 0) {
          quotas.push({ name: `指定加碼 (${(r1 * 100).toFixed(1)}%)`, spent: cum, limit: cap });
        } else {
          quotas.push({ name: `一般回饋 (${(r1 * 100).toFixed(1)}% 無上限)`, spent: cum, limit: 0, unlimited: true });
        }
      }

      return { spent: totalSpent, reward: totalReward, quotas, perTxRewards };
    }

    // 格式化單條額度進度 HTML
    function renderQuotaRowHTML(q) {
      if (q.unlimited) {
        return `
          <div class="quota-item">
            <div class="quota-top">
              <span class="quota-name">${q.name}</span>
              <span class="quota-remain unlimited">♾️ 無上限 <span class="quota-sub">(已刷 $${q.spent.toLocaleString()})</span></span>
            </div>
            <div class="q-track"><div class="q-fill done" style="width:100%"></div></div>
          </div>
        `;
      }

      if (q.isFloor) {
        const diff = Math.max(0, q.limit - q.spent);
        const pct = Math.min(100, (q.spent / q.limit) * 100);
        const done = diff === 0;
        return `
          <div class="quota-item">
            <div class="quota-top">
              <span class="quota-name">${q.name}</span>
              <span class="quota-remain ${done ? 'unlimited' : 'warn'}">
                ${done ? '✅ 已達標' : `還差 $${diff.toLocaleString()} 達標`}
                <span class="quota-sub">($${q.spent.toLocaleString()} / $${q.limit.toLocaleString()})</span>
              </span>
            </div>
            <div class="q-track"><div class="q-fill ${done ? 'done' : 'warn'}" style="width:${pct}%"></div></div>
          </div>
        `;
      }

      const remain = Math.max(0, q.limit - q.spent);
      const pct = Math.min(100, (q.spent / q.limit) * 100);
      const isFull = remain <= 0 || q.officialFull;
      const isWarn = !isFull && pct >= 80;
      const statusClass = isFull ? 'full' : isWarn ? 'warn' : 'ok';

      let rightLabel = `還可刷 $${remain.toLocaleString()}`;
      if (q.officialFull) {
        rightLabel = `⛔ 官方活動已額滿 ${q.officialMsg ? `(${q.officialMsg})` : ''}`;
      } else if (remain <= 0) {
        rightLabel = `🔴 已封頂`;
      }

      return `
        <div class="quota-item">
          <div class="quota-top">
            <span class="quota-name">${q.name}</span>
            <span class="quota-remain ${statusClass}">
              ${rightLabel}
              <span class="quota-sub">(已刷 $${q.spent.toLocaleString()} / 封頂 $${q.limit.toLocaleString()})</span>
            </span>
          </div>
          <div class="q-track"><div class="q-fill ${statusClass}" style="width:${q.officialFull ? 100 : pct}%"></div></div>
        </div>
      `;
    }

    // =========================================================================
    // 5. 記帳與明細 Modal 互動
    // =========================================================================
    function openTxModal(cardId) {
      activeCardIdForTx = cardId;
      const card = getAllCards().find(c => c.id === cardId);
      if (!card) return;

      const cycle = getCycleRange(cardId);
      const stats = analyzeCardQuotas(cardId);

      document.getElementById('txModalCardArtWrap').innerHTML = renderMiniCardHTML(card);
      document.getElementById('txModalCardName').textContent = `${card.name}`;
      document.getElementById('txModalCycleInfo').textContent = `帳單週期：${cycle.label}｜${card.note || ''}`;
      document.getElementById('txModalQuotas').innerHTML = stats.quotas.map(renderQuotaRowHTML).join('');

      const loc = LOCATIONS[currentLocation] || LOCATIONS.TW;
      document.getElementById('txAmountLabel').textContent = `消費金額 (${loc.flag} ${loc.currency})`;
      document.getElementById('txAmountInput').value = '';
      document.getElementById('txNoteInput').value = '';
      document.getElementById('txDateInput').value = new Date().toISOString().split('T')[0];
      document.getElementById('cardCycleDayInput').value = cardSettings[cardId]?.cycleDay || '';

      // 渲染該卡專屬的消費通路/加碼選項
      const modeBox = document.getElementById('txModeContainer');
      let html = `<label class="form-label">選擇消費通路 / 加碼方案</label><div class="radio-group">`;
      if (card.modes && card.modes.length > 0) {
        card.modes.forEach((m, idx) => {
          html += `
            <label class="radio-option">
              <span>${m.label}</span>
              <input type="radio" name="txModeRadio" value="${m.id}" ${idx === 0 ? 'checked' : ''} onchange="updateTxPreview()">
            </label>
          `;
        });
      } else {
        const r1 = ((card.rate || 0.03) * 100).toFixed(1);
        const r2 = ((card.baseRate || 0.01) * 100).toFixed(1);
        html += `
          <label class="radio-option">
            <span>🔥 指定加碼通路 (${r1}%)</span>
            <input type="radio" name="txModeRadio" value="bonus" checked onchange="updateTxPreview()">
          </label>
          <label class="radio-option">
            <span>💳 一般消費 (${r2}%)</span>
            <input type="radio" name="txModeRadio" value="general" onchange="updateTxPreview()">
          </label>
        `;
      }
      html += `</div>`;

      if (card.addons && card.addons.length > 0) {
        html += `<div style="margin-top:8px; display:flex; flex-direction:column; gap:6px;">`;
        card.addons.forEach(ad => {
          const savedChecked = (ad.key === 'isUniUp' && JSON.parse(localStorage.getItem('uni_settings') || '{}').isUp) ||
                               (ad.key === 'isCurrencyHigh' && localStorage.getItem('currency_level') === 'high');
          html += `
            <label class="radio-option" style="border-style:dashed;">
              <span>${ad.label}</span>
              <input type="checkbox" id="addon_${ad.key}" ${savedChecked ? 'checked' : ''} onchange="updateTxPreview()">
            </label>
          `;
        });
        html += `</div>`;
      }
      modeBox.innerHTML = html;

      updateTxPreview();
      renderTxHistoryList(cardId, stats.perTxRewards);
      document.getElementById('txModal').classList.add('open');
    }

    function getExchangeRate(locCode) {
      if (locCode === 'TW') return 1;
      return exchangeRates[locCode] || LOCATIONS[locCode]?.defaultRate || 1;
    }

    function buildTxObjectFromForm(cardId, rawAmount) {
      const card = getAllCards().find(c => c.id === cardId);
      const rate = getExchangeRate(currentLocation);
      const amountTWD = currentLocation === 'TW' ? Math.round(rawAmount) : Math.round(rawAmount * rate);
      const selectedMode = document.querySelector('input[name="txModeRadio"]:checked')?.value || 'general';

      const tx = {
        id: Date.now(),
        cardId,
        amount: rawAmount,
        amountTWD,
        location: currentLocation,
        date: document.getElementById('txDateInput').value || new Date().toISOString().split('T')[0],
        note: document.getElementById('txNoteInput').value.trim(),
        modeLabel: document.querySelector('input[name="txModeRadio"]:checked')?.parentElement?.innerText?.trim() || ''
      };

      // 將選項映射回原版相容欄位
      if (cardId === 'cube1') {
        tx.cubeMode = selectedMode;
        tx.isCubeLinePay = Boolean(document.getElementById('addon_isCubeLinePay')?.checked);
      } else if (cardId === 'c5') {
        tx.laiDianMode = selectedMode;
        tx.isLaiDianNew = Boolean(document.getElementById('addon_isLaiDianNew')?.checked);
      } else if (cardId === 'c10') {
        if (selectedMode === 'uni_icash') { tx.isUniGroup = true; tx.isUniIcash = true; tx.uniBrandCount = 5; }
        else if (selectedMode === 'uni_group') { tx.isUniGroup = true; tx.uniBrandCount = 5; }
        else if (selectedMode === 'uni_overseas') { tx.isUniOverseas = true; }
      } else if (card && card.modes) {
        const mObj = card.modes.find(m => m.id === selectedMode);
        if (mObj?.flag) tx[mObj.flag] = true;
        if (mObj?.rate) tx.customRate = mObj.rate;
        if (mObj?.mpd) tx.mpd = mObj.mpd;
      }

      if (document.getElementById('addon_isBonus10')?.checked) tx.isBonus10 = true;
      if (document.getElementById('addon_isUniUp') !== null) {
        const isUp = document.getElementById('addon_isUniUp').checked;
        localStorage.setItem('uni_settings', JSON.stringify({ isUp }));
      }
      if (document.getElementById('addon_isCurrencyHigh') !== null) {
        const isHigh = document.getElementById('addon_isCurrencyHigh').checked;
        localStorage.setItem('currency_level', isHigh ? 'high' : 'low');
      }

      return tx;
    }

    function updateTxPreview() {
      if (!activeCardIdForTx) return;
      const raw = parseFloat(document.getElementById('txAmountInput').value) || 0;
      const hintEl = document.getElementById('txForeignHint');
      if (currentLocation !== 'TW' && raw > 0) {
        const rate = getExchangeRate(currentLocation);
        const twd = Math.round(raw * rate);
        hintEl.style.display = 'block';
        hintEl.textContent = `💱 依匯率 (${rate.toFixed(4)}) 折合台幣約 $${twd.toLocaleString()} 元`;
      } else {
        hintEl.style.display = 'none';
      }

      if (raw <= 0) {
        document.getElementById('txPreviewReward').textContent = '+$0';
        return;
      }

      // 模擬將此筆交易加入當期計算差額，精準反映封頂截斷後的實際回饋！
      const beforeStats = analyzeCardQuotas(activeCardIdForTx);
      const mockTx = buildTxObjectFromForm(activeCardIdForTx, raw);
      const oldTxs = getTransactions(activeCardIdForTx);
      saveTransactions(activeCardIdForTx, [...oldTxs, mockTx]);
      const afterStats = analyzeCardQuotas(activeCardIdForTx);
      saveTransactions(activeCardIdForTx, oldTxs); // 還原

      const diffReward = Math.max(0, afterStats.reward - beforeStats.reward);
      const card = getAllCards().find(c => c.id === activeCardIdForTx);
      const unit = card?.isMiles ? ' 哩' : '';
      const prefix = card?.isMiles ? '+' : '+$';
      document.getElementById('txPreviewReward').textContent = `${prefix}${diffReward.toLocaleString()}${unit}`;
    }

    function submitTransaction() {
      if (!activeCardIdForTx) return;
      const raw = parseFloat(document.getElementById('txAmountInput').value);
      if (!raw || raw <= 0) {
        alert('請輸入大於 0 的消費金額');
        return;
      }
      const newTx = buildTxObjectFromForm(activeCardIdForTx, raw);
      const allTxs = getTransactions(activeCardIdForTx);
      allTxs.push(newTx);
      saveTransactions(activeCardIdForTx, allTxs);

      renderDashboard();
      openTxModal(activeCardIdForTx); // 刷新彈窗內的剩餘額度與明細
    }

    function deleteTransaction(cardId, txId) {
      const allTxs = getTransactions(cardId).filter(t => String(t.id) !== String(txId));
      saveTransactions(cardId, allTxs);
      renderDashboard();
      openTxModal(cardId);
    }

    function renderTxHistoryList(cardId, perTxRewards) {
      const box = document.getElementById('txHistoryList');
      if (!perTxRewards || perTxRewards.length === 0) {
        box.innerHTML = `<div style="font-size:12.5px; color:var(--text-muted); padding:10px 0;">本期尚無消費紀錄</div>`;
        return;
      }
      const reversed = [...perTxRewards].reverse();
      box.innerHTML = reversed.map(({ tx, reward }) => {
        const amtTWD = Number(tx.amountTWD || tx.amount) || 0;
        return `
          <div class="tx-item">
            <div>
              <div style="font-weight:600;">$${amtTWD.toLocaleString()} ${tx.note ? `· ${escapeHtml(tx.note)}` : ''}</div>
              <div style="font-size:11px; color:var(--text-muted);">${tx.date || ''} ${tx.modeLabel ? `｜${escapeHtml(tx.modeLabel.slice(0, 18))}` : ''}</div>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
              <span style="font-weight:700; color:var(--green);">+$${reward.toLocaleString()}</span>
              <button class="btn btn-sm btn-danger" onclick="deleteTransaction('${cardId}', '${tx.id}')">刪除</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function saveCardCycleDay() {
      if (!activeCardIdForTx) return;
      const val = parseInt(document.getElementById('cardCycleDayInput').value) || 0;
      if (!cardSettings[activeCardIdForTx]) cardSettings[activeCardIdForTx] = {};
      cardSettings[activeCardIdForTx].cycleDay = Math.min(31, Math.max(0, val));
      localStorage.setItem('card_settings', JSON.stringify(cardSettings));
      renderDashboard();
      openTxModal(activeCardIdForTx);
    }

    function uploadCardPhoto(inputEl) {
      if (!activeCardIdForTx) return;
      const file = inputEl.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        localStorage.setItem('card_photo_' + activeCardIdForTx, e.target.result);
        renderDashboard();
        renderManageCards();
        openTxModal(activeCardIdForTx);
      };
      reader.readAsDataURL(file);
    }

    // =========================================================================
    // 6. 分頁 2：銀行登錄與即時額滿監控（串接爬蟲資料庫）
    // =========================================================================
    function setRegFilter(filter, btnEl) {
      currentRegFilter = filter;
      document.querySelectorAll('[data-reg-filter]').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      renderRegistrations();
    }

    function jumpToCardRegs(cardName) {
      switchTab('reg');
      const bankKeyword = cardName.split(' ')[0];
      document.getElementById('regSearchInput').value = bankKeyword;
      setRegFilter('all', document.querySelector('[data-reg-filter="all"]'));
    }

    function getCurrentMonthKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    function toggleRegDone(regId) {
      const mKey = `${regId}_${getCurrentMonthKey()}`;
      if (doneRegistrations[mKey]) delete doneRegistrations[mKey];
      else doneRegistrations[mKey] = true;
      localStorage.setItem('done_registrations', JSON.stringify(doneRegistrations));
      renderRegistrations();
    }

    function formatScheduleText(sched) {
      if (!sched) return '依官網公告';
      const shiftHint = sched.shift === 'next' ? ' (遇假日順延)' : sched.shift === 'prev' ? ' (遇假日提前)' : '';
      if (sched.type === 'monthly') {
        return `每月 ${sched.day} 日 ${sched.time || ''}${shiftHint}`;
      }
      if (sched.type === 'weekly') {
        const wNames = ['日', '一', '二', '三', '四', '五', '六'];
        return `每週${wNames[sched.weekday] || sched.weekday} ${sched.time || ''}`;
      }
      if (sched.type === 'once' || sched.date) {
        return `${sched.date || ''} ${sched.time || ''}`;
      }
      return JSON.stringify(sched);
    }

    function renderRegistrations() {
      const container = document.getElementById('regListContainer');
      const kw = (document.getElementById('regSearchInput')?.value || '').trim().toLowerCase();
      const allCards = getAllCards();
      const curMonthNum = String(new Date().getMonth() + 1);
      const mKeySuffix = getCurrentMonthKey();

      // 若選擇「行動支付/全聯額滿監控」，渲染 promo_status.json 的即時監控面板
      if (currentRegFilter === 'wallet') {
        container.innerHTML = renderWalletPromoStatusHTML();
        return;
      }

      let list = registrationsDB.filter(item => {
        const isMine = (item.cids || []).some(cid => visibleCards.includes(cid));
        const stObj = regStatusDB[item.id] || {};
        const isFull = stObj.status === 'full';
        const isDone = Boolean(doneRegistrations[`${item.id}_${mKeySuffix}`]);

        if (currentRegFilter === 'mine' && !isMine) return false;
        if (currentRegFilter === 'available' && isFull) return false;
        if (currentRegFilter === 'done' && !isDone) return false;

        if (kw) {
          const cardNames = (item.cids || []).map(cid => allCards.find(c => c.id === cid)?.name || cid).join(' ');
          const text = `${item.title} ${item.how || ''} ${item.note || ''} ${cardNames}`.toLowerCase();
          if (!text.includes(kw)) return false;
        }
        return true;
      });

      if (list.length === 0) {
        container.innerHTML = `<div class="empty-state">沒有符合條件的登錄活動</div>`;
        return;
      }

      container.innerHTML = list.map(item => {
        const stObj = regStatusDB[item.id] || {};
        const isFull = stObj.status === 'full';
        const isDone = Boolean(doneRegistrations[`${item.id}_${mKeySuffix}`]);
        const schedText = formatScheduleText(item.schedule);

        // 決定直達登錄網址（支援逐月網址 regUrlByMonth）
        const directRegUrl = (item.regUrlByMonth && item.regUrlByMonth[curMonthNum]) || item.regUrl || item.url;

        let badgeHtml = `<span class="status-pill ok">🟢 尚有名額</span>`;
        if (isDone) {
          badgeHtml = `<span class="status-pill done">✅ 本月已登錄</span>`;
        } else if (isFull) {
          badgeHtml = `<span class="status-pill full">🔴 已額滿 ${stObj.hit ? `(${escapeHtml(stObj.hit)})` : ''}</span>`;
        }

        const cardTagsHtml = (item.cids || []).map(cid => {
          const cObj = allCards.find(c => c.id === cid);
          const isMyCard = visibleCards.includes(cid);
          return `<span class="card-tag ${isMyCard ? 'mine' : ''}">${cObj ? cObj.name : cid}</span>`;
        }).join('');

        return `
          <div class="reg-card ${isFull ? 'is-full' : ''} ${isDone ? 'is-done' : ''}">
            <div class="reg-top">
              <div class="reg-title">${escapeHtml(item.title)}</div>
              ${badgeHtml}
            </div>
            <div class="reg-cards-tags">${cardTagsHtml}</div>
            <div class="reg-meta">
              <span>⏰ <b>開放時間：</b>${escapeHtml(schedText)}</span>
              ${item.quota ? `<span>👥 <b>名額：</b>${escapeHtml(item.quota)}</span>` : ''}
              ${item.note ? `<span>💡 <b>上限：</b>${escapeHtml(item.note)}</span>` : ''}
            </div>
            ${item.how ? `<div style="font-size:12px; color:var(--text-muted);">📍 路徑：${escapeHtml(item.how)}</div>` : ''}
            <div class="cc-actions" style="margin-top:4px;">
              ${directRegUrl ? `<a class="btn btn-primary btn-sm" href="${directRegUrl}" target="_blank" rel="noopener">🚀 直達銀行登錄頁</a>` : ''}
              ${item.url && item.url !== directRegUrl ? `<a class="btn btn-sm" href="${item.url}" target="_blank" rel="noopener">📄 活動詳情</a>` : ''}
              <button class="btn btn-sm" onclick="toggleRegDone('${item.id}')">
                ${isDone ? '↩️ 取消已登錄標記' : '☑️ 標記本月已登錄'}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // 渲染 promo_status.json 的行動支付與全聯即時額滿監控面板
    function renderWalletPromoStatusHTML() {
      const p = promoStatusDB || {};
      const curMonth = String(new Date().getMonth() + 1);
      let html = '';

    function quickSearchMerchant(kw) {

    function renderMerchantSearch() {
      const box = document.getElementById('merchantSearchResult');
      const kw = (document.getElementById('merchantSearchInput')?.value || '').trim().toLowerCase();
      if (!kw) {
        box.innerHTML = `<div class="empty-state">👆 請輸入店名、消費通路或點擊上方常用標籤，立即找出最佳刷卡選擇与剩餘額度</div>`;
        return;
      }

      const results = [];
      const allCards = getAllCards();

      // 1. 搜尋 card_merchants.json 內的詳細品牌清單
      for (const [cid, cData] of Object.entries(merchantsDB.cards || {})) {
        const cardObj = allCards.find(c => c.id === cid);
        const cardName = cardObj?.name || cData.name || cid;
        const isMine = visibleCards.includes(cid);

        for (const [secKey, sec] of Object.entries(cData.sections || {})) {
          const matchedMerchants = [];
          (sec.groups || []).forEach(g => {
            if ((g.label_full || '').toLowerCase().includes(kw)) {
              matchedMerchants.push(g.label_full);
            }
            (g.merchants || []).forEach(m => {
              if (m.toLowerCase().includes(kw)) matchedMerchants.push(m);
            });
          });

          if ((sec.name || '').toLowerCase().includes(kw) || matchedMerchants.length > 0) {
            let rateText = sec.rate ? `${(sec.rate * 100).toFixed(1)}%` : '3%~3.3%';
            if (sec.rate_levels && cData.rate_levels) {
              const rates = sec.rate_levels.map(k => ((cData.rate_levels[k]?.rate || 0) * 100).toFixed(1) + '%');
              rateText = rates.join(' ~ ');
            }
            results.push({
              cid, cardName, isMine,
              sectionName: sec.name,
              rateText,
              matches: matchedMerchants.slice(0, 8).join('、') || sec.name,
              validUntil: sec.valid_until || ''
            });
          }
        }
      }

      // 2. 搜尋內建卡片庫說明與模式
      allCards.forEach(c => {
        const hay = `${c.name} ${c.badge} ${c.note || ''} ${(c.modes || []).map(m => m.label).join(' ')}`.toLowerCase();
        if (hay.includes(kw) && !results.some(r => r.cid === c.id)) {
          results.push({
            cid: c.id,
            cardName: c.name,
            isMine: visibleCards.includes(c.id),
            sectionName: c.badge,
            rateText: c.badge,
            matches: c.note || '',
            validUntil: ''
          });
        }
      });

      // 排序：我的持卡優先
      results.sort((a, b) => (b.isMine ? 1 : 0) - (a.isMine ? 1 : 0));

      if (results.length === 0) {
        box.innerHTML = `<div class="empty-state">找不到包含「${escapeHtml(kw)}」的指定加碼通路，建議使用一般消費高回饋卡（如聯邦賴點卡/吉鶴卡/台新Richart）</div>`;
        return;
      }

      box.innerHTML = results.map(r => {
        const stats = analyzeCardQuotas(r.cid);
        const cardObj = allCards.find(c => c.id === r.cid) || { id: r.cid, name: r.cardName };
        const vis = getCardVisual(cardObj);
        return `
          <div class="cc-card" style="margin-bottom:10px; --card-theme: ${vis.theme};">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
              <div style="display:flex; align-items:center; gap:10px;">
                ${renderMiniCardHTML(cardObj, 'sm')}
                <span style="font-weight:700; font-size:15px;">${escapeHtml(r.cardName)}</span>
                ${r.isMine ? `<span class="card-tag mine">我的持卡</span>` : `<span class="card-tag">未勾選</span>`}
              </div>
              <span class="cc-badge" style="font-size:13px;">${escapeHtml(r.rateText)}</span>
            </div>
            <div style="font-size:13px; color:var(--text-main); margin-bottom:4px;">
              <b>權益方案：</b>${escapeHtml(r.sectionName)}
            </div>
            <div style="font-size:12px; color:var(--text-sub); margin-bottom:8px;">
              <b>命中通路：</b>${escapeHtml(r.matches)}
            </div>
            <div class="quota-list" style="margin-bottom:8px;">
              ${stats.quotas.map(renderQuotaRowHTML).join('')}
            </div>
            <button class="btn btn-sm btn-primary" onclick="openTxModal('${r.cid}')">＋ 用此卡記一筆</button>
          </div>
        `;
      }).join('');
    }

    let pendingPhotoCardId = null;
    function triggerCardPhotoUpload(cardId, evt) {
      if (evt) evt.stopPropagation();
      pendingPhotoCardId = cardId;
      const input = document.getElementById('cardPhotoFileInput');
      if (input) {
        input.value = '';
        input.click();
      }
    }

    function handleCardPhotoSelected(inputEl) {
      const file = inputEl.files?.[0];
      if (!file || !pendingPhotoCardId) return;
      const targetCardId = pendingPhotoCardId;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const W = 320, H = 202;
          canvas.width = W;
          canvas.height = H;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, W, H);
          const scale = Math.max(W / img.width, H / img.height);
          const sw = img.width * scale;
          const sh = img.height * scale;
          ctx.drawImage(img, (W - sw) / 2, (H - sh) / 2, sw, sh);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.88);
          try {
            localStorage.setItem('card_photo_' + targetCardId, dataUrl);
            renderDashboard();
            renderManageCards();
            renderMerchantSearch();
            if (activeCardIdForTx === targetCardId) {
              const cardObj = getAllCards().find(c => c.id === targetCardId);
              if (cardObj) document.getElementById('txModalCardArtWrap').innerHTML = renderMiniCardHTML(cardObj);
            }
          } catch (err) {
            alert('儲存卡面圖片失敗（瀏覽器儲存空間不足）：' + err.message);
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function resetCardPhoto(cardId, evt) {
      if (evt) evt.stopPropagation();
      localStorage.removeItem('card_photo_' + cardId);
      renderDashboard();
      renderManageCards();
      renderMerchantSearch();
      if (activeCardIdForTx === cardId) {
        const cardObj = getAllCards().find(c => c.id === cardId);
        if (cardObj) document.getElementById('txModalCardArtWrap').innerHTML = renderMiniCardHTML(cardObj);

    function toggleCardSelection(cardId) {

      if (idx > -1) visibleCards.splice(idx, 1);
      else visibleCards.push(cardId);
      localStorage.setItem('visibleCards', JSON.stringify(visibleCards));
      renderManageCards();

    function saveCustomCard() {
      const name = document.getElementById('ccName').value.trim();
      const rate = parseFloat(document.getElementById('ccRate').value) || 1;
      const cap = parseInt(document.getElementById('ccCap').value) || 0;
      const tier2Rate = parseFloat(document.getElementById('ccTier2').value) || 0;

      const customs = JSON.parse(localStorage.getItem('custom_cards') || '[]');
      const newId = 'custom_' + Date.now();
      customs.push({ id: newId, name, rate, cap, tier2Rate, gradient: '', textColor: 'white' });
      localStorage.setItem('custom_cards', JSON.stringify(customs));

      renderDashboard();

    // 匯出與匯入備份（完全相容原版備份 JSON 格式）
    function exportBackup() {
      const transactions = {};
      getAllCards().forEach(c => {
        const txs = getTransactions(c.id);
        if (txs.length > 0) transactions[c.id] = txs;
      });
      const cardPhotos = {};
      getAllCards().forEach(c => {
        const p = localStorage.getItem('card_photo_' + c.id);
        if (p) cardPhotos[c.id] = p;
      });
      const backupObj = {
        version: 'Clean-1.0',
        exportTime: new Date().toISOString(),
        visibleCards,
        cardSettings,
        doneRegistrations,
        customCards: JSON.parse(localStorage.getItem('custom_cards') || '[]'),
        cardPhotos,
        transactions
      };
      const blob = new Blob([JSON.stringify(backupObj, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const dateStr = new Date().toISOString().split('T')[0];
      a.download = `刷卡回饋管家_備份_${dateStr}.json`;
      a.click();
    }

    function importBackup(inputEl) {
      const file = inputEl.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          if (!confirm('確定要還原此備份檔嗎？這將覆蓋目前的記帳與卡片設定。')) return;

          if (Array.isArray(data.visibleCards)) {
            visibleCards = data.visibleCards.filter(id => id !== 'add1');
            localStorage.setItem('visibleCards', JSON.stringify(visibleCards));
          }
          if (data.cardSettings) {
            cardSettings = data.cardSettings;
            localStorage.setItem('card_settings', JSON.stringify(cardSettings));
          }
          if (data.doneRegistrations) {
            doneRegistrations = data.doneRegistrations;
            localStorage.setItem('done_registrations', JSON.stringify(doneRegistrations));
          }
          if (Array.isArray(data.customCards)) {
            localStorage.setItem('custom_cards', JSON.stringify(data.customCards));
          }
          if (data.cardPhotos && typeof data.cardPhotos === 'object') {
            for (const [cid, photoData] of Object.entries(data.cardPhotos)) {
              if (typeof photoData === 'string' && photoData.startsWith('data:image/')) {
                localStorage.setItem('card_photo_' + cid, photoData);
              }
            }
          }
          if (data.transactions && typeof data.transactions === 'object') {
            for (const [cid, txs] of Object.entries(data.transactions)) {
              if (Array.isArray(txs)) {
                const cleanKey = cid.replace(/^transactions_/, '');
                saveTransactions(cleanKey, txs);
              }
            }
          }
          alert('✅ 備份還原成功！');
          location.reload();
        } catch (err) {
          alert('讀取備份失敗：' + err.message);
        }
      };
      reader.readAsText(file);
    }

    function escapeHtml(str) {

    }

    async function loadAllData() {
      const ts = Date.now();
      const UPSTREAM_RAW = 'https://raw.githubusercontent.com/shawn2026-oss/shawn-2026-creditcard/main';
      try {
        // 1. 先瞬間載入本機儲存庫內的 JSON 副本，確保秒開與離線可用
        const [mRes, rRes, rsRes, pRes, cRes] = await Promise.allSettled([
          fetch(`./card_merchants.json?t=${ts}`).then(r => r.json()),
          fetch(`./registrations.json?t=${ts}`).then(r => r.json()),
          fetch(`./registration_status.json?t=${ts}`).then(r => r.json()),
          fetch(`./promo_status.json?t=${ts}`).then(r => r.json()),
          fetch(`./config.json?t=${ts}`).then(r => r.json())
        ]);

        if (mRes.status === 'fulfilled') merchantsDB = mRes.value;
        if (rRes.status === 'fulfilled') registrationsDB = rRes.value.items || [];
        if (rsRes.status === 'fulfilled') regStatusDB = rsRes.value.items || {};
        if (pRes.status === 'fulfilled') promoStatusDB = pRes.value || {};
        if (cRes.status === 'fulfilled') configDB = cRes.value || {};

        const updatedDate = promoStatusDB.updated || rRes.value?.updated || '最新';
        document.getElementById('syncStatusBadge').textContent = `資料同步：${updatedDate}`;
      } catch (e) {
        document.getElementById('syncStatusBadge').textContent = '離線快取模式';
      }

      renderDashboard();
      renderRegistrations();
      renderMerchantSearch();
      renderManageCards();

      // 2. 背景向官方資料源拉取最新 JSON（純資料校驗，不執行任何外部腳本）
      try {
        const [uM, uR, uRS, uP, uC] = await Promise.allSettled([
          fetch(`${UPSTREAM_RAW}/card_merchants.json?t=${ts}`).then(r => r.ok ? r.json() : Promise.reject()),
          fetch(`${UPSTREAM_RAW}/registrations.json?t=${ts}`).then(r => r.ok ? r.json() : Promise.reject()),
          fetch(`${UPSTREAM_RAW}/registration_status.json?t=${ts}`).then(r => r.ok ? r.json() : Promise.reject()),
          fetch(`${UPSTREAM_RAW}/promo_status.json?t=${ts}`).then(r => r.ok ? r.json() : Promise.reject()),
          fetch(`${UPSTREAM_RAW}/config.json?t=${ts}`).then(r => r.ok ? r.json() : Promise.reject())
        ]);
        let changed = false;
        if (uM.status === 'fulfilled' && uM.value?.cards) { merchantsDB = uM.value; changed = true; }
        if (uR.status === 'fulfilled' && Array.isArray(uR.value?.items)) { registrationsDB = uR.value.items; changed = true; }
        if (uRS.status === 'fulfilled' && uRS.value?.items) { regStatusDB = uRS.value.items; changed = true; }
        if (uP.status === 'fulfilled' && typeof uP.value === 'object') { promoStatusDB = uP.value; changed = true; }
        if (uC.status === 'fulfilled' && typeof uC.value === 'object') { configDB = uC.value; changed = true; }

        if (changed) {
          const liveDate = promoStatusDB.updated || uR.value?.updated || '即時';
          document.getElementById('syncStatusBadge').textContent = `⚡ 即時同步：${liveDate}`;
          renderDashboard();
          renderRegistrations();
          if ((document.getElementById('merchantSearchInput')?.value || '').trim()) {
            renderMerchantSearch();
          }
        }
      } catch (e) {}
    }

    // 啟動初始化
    (function init() {
      const savedTheme = localStorage.getItem('clean_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      document.getElementById('themeBtn').textContent = savedTheme === 'dark' ? '☀️' : '🌙';

      const loc = LOCATIONS[currentLocation] || LOCATIONS.TW;
      document.getElementById('locFlag').textContent = loc.flag;
      document.getElementById('locCurrency').textContent = loc.currency;

      loadAllData();
      fetchRatesIfNeeded();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    })();
  </script>
</body>
</html>
